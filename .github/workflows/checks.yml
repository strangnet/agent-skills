name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  references-in-sync:
    name: Shared references in sync
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check vendored language references match references/languages/
        run: scripts/sync-references.sh --check

  versions-in-sync:
    name: Manifest versions in sync
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check every plugin manifest declares the same version
        run: scripts/validate-versions.sh

  floor-guard:
    name: floor-guard tests
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run the floor-guard test suite
        run: scripts/test-floor-guard.sh
