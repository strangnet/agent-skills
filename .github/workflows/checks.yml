name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  references-in-sync:
    name: Shared references in sync
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check vendored language references match references/languages/
        run: scripts/sync-references.sh --check
